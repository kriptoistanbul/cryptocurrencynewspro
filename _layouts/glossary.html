<!DOCTYPE html>
<html lang="{{ site.language }}">
    {% include head.html %}
    <body class="main-page has-push-menu">
        {% include svg-icons.html %}
        {% include header.html %}
        <section class="content">
            <main class="home" id="glossary" role="main">
                <h1 class="title-category">{{ page.title }}</h1>
                <div id="grid" class="row flex-grid">
                    {% for entry in site.glossary %}
                        <article class="box-item">
                            <div class="box-body">
                                <div class="box-info">
                                    <a class="entry-link" href="{{ entry.url | prepend: site.baseurl }}">
                                        <h2 class="entry-title">{{ entry.title }}</h2>
                                    </a>
                                    <p class="description">{{ entry.excerpt | strip_html }}</p>
                                </div>
                            </div>
                        </article>
                    {% endfor %}
                </div>

            </main>
        </section>
        {% include footer.html %}
    </body>
</html>
